name: Publish calendar

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # January 1 and July 1, 08:17 Hong Kong time.
    - cron: '17 0 1 1,7 *'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: '3.14'
      - name: Install project
        run: uv sync --locked --no-dev
      - name: Generate calendar
        run: |
          mkdir -p _site
          for attempt in 1 2 3; do
            if uv run --locked --no-sync solar-terms -o _site/solar_terms.ics; then
              exit 0
            fi
            echo "Generation failed (attempt $attempt/3)." >&2
            if (( attempt < 3 )); then
              sleep 15
            fi
          done
          exit 1
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}solar_terms.ics
    steps:
      - name: Deploy calendar
        id: deployment
        uses: actions/deploy-pages@v5.0.1
